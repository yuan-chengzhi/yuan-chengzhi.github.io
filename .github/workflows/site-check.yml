name: Check static site
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify generated HTML and SVG
        run: python3 scripts/build_site.py --check
      - name: Run offline regression checks
        run: python3 -m unittest discover -s tests -v
      - name: Check progressive enhancement syntax
        run: node --check site.js
